[project]
name = "cosmic-session-manager"
version = "0.1.0"
description = "Wayland-native session restore and workspace automation for COSMIC Desktop"
authors = [
    { name = "Antigravity Agent", email = "antigravity@deepmind.google.com" }
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "psutil>=5.9.0",
    "watchdog>=3.0.0"
]
requires-python = ">=3.11"

[project.scripts]
cosmic-wm = "cosmic_wm_manager.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cosmic_wm_manager"]

